<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet & Social Media Mastery Quiz｜4 Sessions</title>
<style>
:root {
  --bg:#F5EFE0;
  --bg-soft:#EDE4D0;
  --card:#FBF7EC;
  --ink:#2E3A3A;
  --muted:#6B7775;
  --accent:#5B8A8A;
  --accent-dark:#406A6A;
  --line:#D8CFBA;
  --shadow:0 2px 0 rgba(46,58,58,.08),0 12px 34px rgba(46,58,58,.08);
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, rgba(91,138,138,.12), transparent 28%),
    radial-gradient(circle at 88% 2%, rgba(232,201,122,.18), transparent 30%),
    var(--bg);
}
button { font:inherit; }
#launcher {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px 48px;
}
.launch-card {
  width:min(940px,100%);
  background:rgba(251,247,236,.94);
  border:1px solid rgba(216,207,186,.95);
  border-radius:22px;
  padding:32px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}
.eyebrow {
  margin:0 0 8px;
  color:var(--accent);
  font-size:.78rem;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
}
h1 {
  margin:0;
  color:var(--accent-dark);
  font-size:clamp(1.65rem,4vw,2.55rem);
  line-height:1.18;
}
.lead {
  max-width:720px;
  margin:12px 0 26px;
  color:var(--muted);
  line-height:1.7;
}
.session-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.session-btn {
  appearance:none;
  width:100%;
  min-height:150px;
  padding:20px;
  text-align:left;
  background:#FFFDF6;
  color:var(--ink);
  border:1.5px solid var(--line);
  border-radius:16px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(46,58,58,.04);
  transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease,background .14s ease;
}
.session-btn:hover {
  transform:translateY(-2px);
  border-color:var(--accent);
  background:#FFFFFF;
  box-shadow:0 9px 22px rgba(46,58,58,.09);
}
.session-btn:active { transform:translateY(0); }
.session-lang {
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--accent-dark);
  font-size:.78rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.session-title {
  display:block;
  margin:9px 0 4px;
  font-size:1.12rem;
  font-weight:800;
}
.session-meta {
  display:block;
  color:var(--muted);
  font-size:.9rem;
  line-height:1.55;
}
.badges {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:13px;
}
.badge {
  padding:4px 9px;
  border-radius:999px;
  background:var(--bg-soft);
  border:1px solid var(--line);
  color:var(--accent-dark);
  font-size:.72rem;
  font-weight:750;
}
.launch-note {
  margin:22px 0 0;
  color:var(--muted);
  text-align:center;
  font-size:.82rem;
}
#sessionShell {
  display:none;
  min-height:100vh;
  background:var(--bg);
}
.shell-bar {
  height:58px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 12px;
  background:rgba(251,247,236,.97);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 3px 16px rgba(46,58,58,.06);
}
.back-btn {
  border:1.5px solid var(--accent);
  color:var(--accent-dark);
  background:transparent;
  border-radius:10px;
  padding:8px 13px;
  font-weight:750;
  cursor:pointer;
}
.back-btn:hover { background:var(--bg-soft); }
#activeLabel {
  color:var(--muted);
  font-size:.9rem;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#sessionFrame {
  display:block;
  width:100%;
  height:calc(100vh - 58px);
  border:0;
  background:var(--bg);
}
.loading {
  min-height:calc(100vh - 58px);
  display:grid;
  place-items:center;
  color:var(--accent-dark);
  font-weight:800;
}
@media (max-width:680px) {
  .launch-card { padding:23px 16px; border-radius:17px; }
  .session-grid { grid-template-columns:1fr; }
  .session-btn { min-height:132px; }
  #activeLabel { font-size:.78rem; }
}
</style>
</head>
<body>
<section id="launcher">
  <main class="launch-card">
    <p class="eyebrow">Four-session mastery hub</p>
    <h1>Internet &amp; Social Media Mastery Quiz</h1>
    <p class="lead">
      日本語と英語、それぞれ15分の公式セッションと20分の反復練習を、
      この一つのHTMLから開けます。全セッションは独立して動作し、
      日本語15分版と英語15分版の受験履歴も別々に保存されます。
    </p>

    <div class="session-grid">
      <button class="session-btn" type="button" onclick="openSession('ja15')">
        <span class="session-lang">🇯🇵 日本語</span>
        <span class="session-title">15分 公式セッション</span>
        <span class="session-meta">全44問をシャッフルして受験。採点、履歴保存、最新誤答のみの再練習に対応。</span>
        <span class="badges"><span class="badge">15:00</span><span class="badge">Official</span><span class="badge">44 MCQs</span></span>
      </button>

      <button class="session-btn" type="button" onclick="openSession('ja20')">
        <span class="session-lang">🇯🇵 日本語</span>
        <span class="session-title">20分 反復練習</span>
        <span class="session-meta">全44問を固定順で練習。各問題を個別にリセットして、その場で繰り返せる。</span>
        <span class="badges"><span class="badge">20:00</span><span class="badge">Repeat</span><span class="badge">Reset enabled</span></span>
      </button>

      <button class="session-btn" type="button" onclick="openSession('en15')">
        <span class="session-lang">🇬🇧 English</span>
        <span class="session-title">15-minute Official Session</span>
        <span class="session-meta">All 44 questions in shuffled order, with scoring, attempt history, and latest-error practice.</span>
        <span class="badges"><span class="badge">15:00</span><span class="badge">Official</span><span class="badge">44 MCQs</span></span>
      </button>

      <button class="session-btn" type="button" onclick="openSession('en20')">
        <span class="session-lang">🇬🇧 English</span>
        <span class="session-title">20-minute Repeat Practice</span>
        <span class="session-meta">All 44 questions in fixed order, with a per-question reset control for deliberate repetition.</span>
        <span class="badges"><span class="badge">20:00</span><span class="badge">Repeat</span><span class="badge">Reset enabled</span></span>
      </button>
    </div>

    <p class="launch-note">単一ファイル・オフライン動作・外部ライブラリなし</p>
  </main>
</section>

<section id="sessionShell">
  <nav class="shell-bar">
    <button class="back-btn" type="button" onclick="returnToMenu()">← 4セッション一覧</button>
    <span id="activeLabel"></span>
  </nav>
  <div id="frameLoading" class="loading">セッションを読み込み中...</div>
  <iframe
    id="sessionFrame"
    title="Quiz session"
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals"
    referrerpolicy="no-referrer"
  ></iframe>
</section>

<script>
const sessionLabels = {
  ja15: "日本語 · 15分公式セッション",
  ja20: "日本語 · 20分反復練習",
  en15: "English · 15-minute Official Session",
  en20: "English · 20-minute Repeat Practice"
};

const payload = JSON.parse(document.getElementById("sessionPayload").textContent);
const launcher = document.getElementById("launcher");
const shell = document.getElementById("sessionShell");
const frame = document.getElementById("sessionFrame");
const loading = document.getElementById("frameLoading");
const activeLabel = document.getElementById("activeLabel");
let currentSession = null;

function decodeUtf8Base64(value) {
  const binary = atob(value);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function openSession(key) {
  if (!payload[key]) return;
  currentSession = key;
  activeLabel.textContent = sessionLabels[key] || "";
  launcher.style.display = "none";
  shell.style.display = "block";
  loading.style.display = "grid";
  frame.style.display = "none";
  frame.srcdoc = decodeUtf8Base64(payload[key]);
  window.scrollTo(0, 0);
}

frame.addEventListener("load", () => {
  loading.style.display = "none";
  frame.style.display = "block";
  try { frame.contentWindow.focus(); } catch (e) {}
});

function returnToMenu() {
  if (!currentSession) return;
  const ok = window.confirm(
    "現在のセッションを閉じて、4セッション一覧へ戻りますか？\n進行中の未提出内容は失われる場合があります。"
  );
  if (!ok) return;
  frame.srcdoc = "";
  currentSession = null;
  shell.style.display = "none";
  launcher.style.display = "flex";
  activeLabel.textContent = "";
  window.scrollTo(0, 0);
}

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && currentSession) returnToMenu();
});
</script>
