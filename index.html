<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Convergence & Cyberactivism Mastery Quiz</title>
<style>
  :root {
    --bg:        #F5EFE0;
    --bg-soft:   #EDE4D0;
    --card:      #FBF7EC;
    --ink:       #2E3A3A;
    --muted:     #6B7775;
    --accent:    #5B8A8A;
    --accent-d:  #406A6A;
    --good:      #7BA77B;
    --good-bg:   #DFEBDC;
    --bad:       #B8746B;
    --bad-bg:    #EFD9D3;
    --hi:        #E8C97A;
    --line:      #d8cfba;
    --shadow:    0 2px 0 rgba(46,58,58,0.08), 0 6px 18px rgba(46,58,58,0.06);
    --radius:    14px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height:1.55; min-height:100vh; display:flex; justify-content:center;
    padding:24px 14px 60px;
  }
  .wrap { width:100%; max-width:860px; }
  header { text-align:center; margin-bottom:18px; }
  header h1 { font-size:1.45rem; margin:0 0 4px; color:var(--accent-d); letter-spacing:.3px; }
  header p { margin:0; color:var(--muted); font-size:.9rem; }
  .top-quiz-timer { display:flex; justify-content:flex-end; align-items:center; margin:0 0 10px; min-height:34px; }
  .data-store { display:none; }
  .jump { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 12px; justify-content:center; }
  .jump button { background:var(--card); color:var(--accent-d); border:1px solid var(--line); border-radius:10px; padding:7px 10px; font-weight:700; cursor:pointer; min-width:34px; }
  .jump button.current { background:var(--accent); color:#fff; border-color:var(--accent-d); }
  .jump button.done { background:var(--good-bg); border-color:var(--good); }
  .jump button.miss { background:var(--bad-bg); border-color:var(--bad); }
  .progress-track { width:100%; height:6px; background:var(--bg-soft); border-radius:999px; overflow:hidden; margin-bottom:16px; }
  .progress-fill { height:100%; background:var(--accent); width:0%; transition:width .3s ease; }
  .card { background:var(--card); border-radius:var(--radius); padding:24px 22px 20px; box-shadow:var(--shadow); }
  .qnum { font-size:.75rem; letter-spacing:1.2px; color:var(--accent); text-transform:uppercase; margin-bottom:6px; font-weight:600; }
  .qtype-tag { display:inline-block; margin-left:8px; padding:2px 8px; border-radius:999px; background:var(--hi); color:#6b4f1a; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .qtext { font-size:1.08rem; margin:4px 0 16px; color:var(--ink); }
  .source { font-size:.78rem; color:var(--muted); margin-top:-8px; margin-bottom:14px; }
  code { background:var(--hi); padding:1px 6px; border-radius:4px; font-family:"SF Mono", Menlo, Consolas, monospace; font-size:.92em; }
  .options { display:grid; gap:9px; }
  .opt {
    text-align:left; background:#FFFDF6; border:1.5px solid var(--line); color:var(--ink);
    padding:11px 13px; border-radius:10px; font-size:.96rem; cursor:pointer;
    transition:all .15s ease; font-family:inherit; line-height:1.45; width:100%;
    display:flex; align-items:center; white-space:normal; overflow:hidden;
  }
  .opt:hover:not(:disabled) { border-color:var(--accent); background:#FFFEFA; transform:translateY(-1px); }
  .opt:disabled { cursor:default; }
  .opt.correct, .opt.reveal { background:var(--good-bg); border-color:var(--good); color:#2f4a2f; }
  .opt.wrong { background:var(--bad-bg); border-color:var(--bad); color:#5a2c26; }
  .marker { display:inline-block; width:22px; height:22px; line-height:22px; border-radius:50%; background:var(--bg-soft); color:var(--muted); text-align:center; font-size:.78rem; margin-right:10px; font-weight:700; flex:0 0 auto; }
  .opt.correct .marker, .opt.reveal .marker { background:var(--good); color:white; }
  .opt.wrong .marker { background:var(--bad); color:white; }
  .optText { display:inline-block; }
  .small { color:var(--muted); font-size:.84rem; }

  .select-match { display:flex; flex-direction:column; gap:10px; }
  .select-row { display:grid; grid-template-columns:minmax(170px, 34%) 1fr; gap:10px; align-items:center; background:#FFFDF6; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; }
  .select-term { font-weight:700; color:var(--accent-d); font-size:.94rem; }
  .select-row select { width:100%; font:inherit; color:var(--ink); background:white; border:1.5px solid var(--line); border-radius:9px; padding:8px 10px; cursor:pointer; }
  .select-row.correct { background:var(--good-bg); border-color:var(--good); }
  .select-row.wrong { background:var(--bad-bg); border-color:var(--bad); }
  .select-row.correct select { border-color:var(--good); background:#f7fff4; color:#2f4a2f; }
  .select-row.wrong select { border-color:var(--bad); background:#fff6f3; color:#5a2c26; }
  .select-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:13px; }
  .dd-hint { font-size:.85rem; color:var(--accent-d); margin-bottom:14px; padding:8px 12px; background:rgba(91,138,138,.08); border-radius:8px; border-left:3px solid var(--accent); }
  .dd-card { background:var(--card); border:1.5px solid var(--accent); color:var(--accent-d); padding:7px 12px; border-radius:8px; font-size:.9rem; cursor:grab; font-weight:500; user-select:none; -webkit-user-select:none; touch-action:none; -webkit-user-drag:none; transition:background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease; font-family:inherit; line-height:1.4; text-align:left; }
  .dd-card:hover:not(:disabled) { background:#fff; }
  .dd-card:active:not(:disabled) { cursor:grabbing; }
  .dd-card.selected { background:#FFFDF6; color:var(--accent-d); transform:translateY(-1px); box-shadow:0 0 0 3px rgba(91,138,138,.22); }
  .dd-card.drag-source { opacity:1; background:#FFFDF6; color:var(--accent-d); border-color:var(--accent-d); box-shadow:0 0 0 3px rgba(91,138,138,.18); }
  .dd-drag-ghost { position:fixed; left:0; top:0; z-index:9998; pointer-events:none; opacity:1; background:#FFFDF6; color:var(--accent-d); border:1.5px solid var(--accent-d); box-shadow:0 14px 30px rgba(46,58,58,.2); transform:translate3d(var(--drag-x,0), var(--drag-y,0), 0); cursor:grabbing; max-width:min(420px, calc(100vw - 28px)); }
  .dd-card.correct { background:var(--good-bg); border-color:var(--good); color:#2f4a2f; cursor:default; }
  .dd-card.wrong { background:var(--bad-bg); border-color:var(--bad); color:#5a2c26; cursor:default; }
  .slot-target { border:2px dashed var(--line); border-radius:8px; background:var(--bg-soft); padding:5px; min-height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color .15s ease, background .15s ease, box-shadow .15s ease; }
  .slot-target:hover { border-color:var(--accent); }
  .slot-target.drop-active { border-color:var(--accent-d); background:#FFFDF6; box-shadow:inset 0 0 0 2px rgba(91,138,138,.18); }
  .slot-target.has-card { border-style:solid; background:#fbf3df; padding:4px; }
  .slot-target.correct { border-color:var(--good); background:var(--good-bg); border-style:solid; }
  .slot-target.wrong { border-color:var(--bad); background:var(--bad-bg); border-style:solid; }
  .slot-target .placeholder { color:var(--muted); font-size:.82rem; }
  .slot-target .dd-card { width:100%; }
  .match-list, .order-list { display:flex; flex-direction:column; gap:8px; }
  .match-row { display:flex; align-items:center; gap:10px; }
  .match-label { flex:1; font-size:.9rem; color:var(--ink); }
  .match-row .slot-target { width:320px; flex:none; }
  .order-row { display:flex; align-items:stretch; gap:10px; }
  .order-num { width:34px; min-height:44px; border-radius:8px; background:var(--accent); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; font-size:1rem; }
  .order-row .slot-target { flex:1; }
  .card-bank { margin-top:14px; padding:11px 12px; background:var(--bg-soft); border-radius:10px; border:1px solid var(--line); }
  .card-bank-label { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; font-weight:600; }
  .card-bank-cards { display:flex; flex-wrap:wrap; gap:6px; min-height:38px; border:1.5px dashed transparent; border-radius:9px; padding:3px; transition:border-color .15s ease, background .15s ease; }
  .card-bank-cards.drop-active { border-color:var(--accent); background:#FFFDF6; }
  .fillbox { display:grid; gap:10px; }
  .fill-row { background:#FFFDF6; border:1.5px solid var(--line); border-radius:10px; padding:12px 13px; font-size:.96rem; }
  .fill-row input { font:inherit; font-weight:600; color:var(--ink); padding:6px 8px; margin:0 4px; border-radius:8px; border:1.5px solid var(--line); background:#fff; min-width:170px; max-width:100%; }
  .fill-row input.correct { background:var(--good-bg); border-color:var(--good); color:#2f4a2f; }
  .feedback { margin-top:14px; padding:11px 13px; border-radius:10px; font-size:.92rem; display:none; line-height:1.5; }
  .feedback.good { background:var(--good-bg); color:#2f4a2f; display:block; }
  .feedback.bad { background:var(--bad-bg); color:#5a2c26; display:block; }
  .feedback.info { background:var(--bg-soft); color:var(--ink); display:block; }
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  button.btn { background:var(--accent); color:#FBF7EC; border:none; padding:11px 18px; border-radius:10px; font-size:.96rem; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s ease, transform .1s ease; display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; }
  button.btn:hover { background:var(--accent-d); }
  button.btn:active { transform:translateY(1px); }
  button.btn.ghost { background:transparent; color:var(--accent-d); border:1.5px solid var(--accent); }
  button.btn.ghost:hover { background:var(--bg-soft); }
  button.btn.arrow { width:50px; padding:11px 0; font-size:1.2rem; line-height:1; }
  button.btn.retry-reset { width:50px; padding:11px 0; font-size:1.2rem; line-height:1; }
  .result { text-align:center; padding:12px 6px 6px; }
  .result h2 { margin:0 0 6px; color:var(--accent-d); font-size:1.5rem; }
  .score-big { font-size:2.6rem; font-weight:700; color:var(--ink); margin:12px 0 4px; }
  footer { text-align:center; color:var(--muted); font-size:.78rem; margin-top:20px; }

  .hidden { display:none !important; }
  .opening { text-align:center; padding:28px 18px 24px; }
  .opening h2 { margin:0 0 8px; color:var(--accent-d); font-size:1.55rem; }
  .opening p { margin:8px auto; max-width:620px; color:var(--muted); }
  .opening .attempt-badge { display:inline-block; margin:14px 0 18px; background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:7px 14px; color:var(--ink); font-weight:700; }
  .opening-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .practice-message { margin:12px auto 0; max-width:520px; }
  .attempt-history { margin:18px auto 18px; max-width:620px; text-align:left; background:#FFFDF6; border:1.5px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:0 2px 0 rgba(46,58,58,0.04); }
  .attempt-history h3 { margin:0 0 10px; color:var(--accent-d); font-size:1rem; }
  .attempt-list { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  .attempt-list li { display:flex; justify-content:space-between; gap:10px; align-items:center; background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:.9rem; }
  .attempt-list .attempt-meta { color:var(--muted); font-size:.8rem; }
  .attempt-list .attempt-score { color:var(--ink); font-weight:800; white-space:nowrap; }
  .submit-row { justify-content:space-between; align-items:center; }
  .submit-note { color:var(--muted); font-size:.84rem; }
  .timer-pill { position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:9px; min-width:104px; justify-content:center; background:linear-gradient(180deg, #FFFDF6, var(--card)); padding:7px 15px 8px 12px; border-radius:999px; border:1px solid var(--line); transition:background .35s ease, border-color .35s ease, color .35s ease, box-shadow .35s ease; font-weight:800; color:var(--accent-d); box-shadow:0 5px 16px rgba(46,58,58,0.07), inset 0 1px 0 rgba(255,255,255,.7); letter-spacing:.6px; }
  .stopwatch { position:relative; width:22px; height:22px; border:2px solid currentColor; border-radius:50%; flex:0 0 auto; opacity:.9; box-shadow:inset 0 0 0 2px rgba(255,255,255,.45); }
  .stopwatch::before { content:""; position:absolute; width:8px; height:4px; border-radius:4px 4px 2px 2px; background:currentColor; left:50%; top:-7px; transform:translateX(-50%); opacity:.82; }
  .stopwatch::after { content:""; position:absolute; width:5px; height:3px; border-radius:4px; background:currentColor; right:-5px; top:1px; transform:rotate(38deg); opacity:.65; }
  .stopwatch-hand { position:absolute; left:50%; top:50%; width:2px; height:7px; border-radius:999px; background:currentColor; transform-origin:50% 100%; transform:translate(-50%, -100%) rotate(0deg); }
  .timer-pill.running .stopwatch-hand { animation:stopwatchTick var(--timer-duration, 900s) linear forwards; }
  .stopwatch-hand::after { content:""; position:absolute; left:50%; bottom:-3px; width:4px; height:4px; border-radius:50%; background:currentColor; transform:translateX(-50%); }
  .timer-pill.warning { background:linear-gradient(180deg, #fff8f2, var(--bad-bg)); border-color:var(--bad); color:#5a2c26; }
  .timer-pill.warning .stopwatch { opacity:1; }
  .timer-pill.urgent { box-shadow:0 0 0 3px rgba(255,80,80,.14), 0 5px 16px rgba(46,58,58,0.07); }
  .loading-screen { display:flex; align-items:center; justify-content:center; padding:12px 0; min-height:240px; background:transparent; }
  .loading-panel { width:min(100%, 460px); margin:0 auto; background:linear-gradient(180deg, #FFFDF6 0%, var(--card) 100%); color:var(--ink); border:1.5px solid var(--line); border-radius:18px; padding:26px 18px 22px; box-shadow:0 10px 28px rgba(46,58,58,.08), inset 0 1px 0 rgba(255,255,255,.6); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .loading-title { font-size:1.35rem; font-weight:700; margin:16px 0 8px; letter-spacing:.2px; color:var(--accent-d); text-align:center; }
  .loading-sub { color:var(--muted); font-size:.92rem; text-align:center; max-width:360px; line-height:1.6; }
  .loading-mini { margin-top:10px; color:var(--muted); font-size:.8rem; text-align:center; }
  .wait-orb { position:relative; width:108px; height:108px; }
  .wait-core { position:absolute; inset:38px; border-radius:50%; background:linear-gradient(180deg, var(--card), #fff); border:1px solid var(--line); box-shadow:inset 0 2px 8px rgba(46,58,58,.06); }
  .wait-ring { position:absolute; border-radius:50%; border:4px solid transparent; }
  .wait-ring.ring-a { inset:0; border-top-color:var(--accent); border-right-color:#82AAA6; animation:spinRing 1s linear infinite; }
  .wait-ring.ring-b { inset:12px; border-bottom-color:var(--hi); border-left-color:#9BBDB5; animation:spinRingReverse 1.35s linear infinite; }
  .wait-dot { position:absolute; width:12px; height:12px; border-radius:50%; background:#E8C97A; top:10px; left:calc(50% - 6px); box-shadow:0 0 0 5px rgba(232,201,122,.14); animation:dotPulse 1.2s ease-in-out infinite; }
  @keyframes spinRing { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes spinRingReverse { from { transform:rotate(360deg); } to { transform:rotate(0deg); } }
  @keyframes dotPulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(.82); opacity:.75; } }
  .guard-toast { position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-10px); opacity:0; pointer-events:none; z-index:9999; background:linear-gradient(180deg, #FFFDF6, var(--card)); color:var(--accent-d); border:1.5px solid var(--line); border-radius:999px; padding:9px 15px; box-shadow:0 10px 26px rgba(46,58,58,.12); font-size:.9rem; font-weight:700; transition:opacity .18s ease, transform .18s ease; }
  .guard-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @keyframes stopwatchTick { from { transform:translate(-50%, -100%) rotate(0deg); } to { transform:translate(-50%, -100%) rotate(360deg); } }
  @media (max-width: 560px) {
    body { padding:14px 10px 40px; }
    .card { padding:20px 16px 18px; }
    .qtext { font-size:1rem; }
    header h1 { font-size:1.25rem; }
    .match-row { flex-direction:column; align-items:stretch; gap:4px; }
    .select-row { grid-template-columns:1fr; gap:6px; }
    .match-row .slot-target { width:100%; }
    .fill-row input { width:100%; margin:8px 0 0; }
    .loading-panel { padding:22px 14px 18px; }
    .wait-orb { width:92px; height:92px; }
    .wait-core { inset:32px; }
    .loading-title { font-size:1.2rem; }
    .timer-pill { min-width:98px; padding-right:13px; }
    .stopwatch { width:20px; height:20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-quiz-timer hidden" id="quizBar">
    <span class="timer-pill" id="timerPill"><span class="stopwatch" aria-hidden="true"><span class="stopwatch-hand"></span></span><strong id="timer">45:00</strong></span>
  </div>
  <header>
    <h1 id="mainTitle">Convergence & Cyberactivism</h1>
    <p id="subtitle">42-question MCQ mastery quiz &middot; Japanese / English &middot; shuffled every attempt</p>
  </header>
  <div class="data-store" aria-hidden="true">
    <span id="round">1</span>
    <span id="qIdx">1</span>
    <span id="qTotal">0</span>
    <span id="score">0</span>
    <span id="best">&mdash;</span>
    <span id="completed">0</span>
  </div>
  <div class="jump hidden" id="jump"></div>
  <div class="progress-track hidden" id="progressTrack"><div class="progress-fill" id="progress"></div></div>
  <div class="card" id="card"></div>
  <footer>Convergence & Cyberactivism &middot; Media convergence &middot; Indymedia &middot; Dangerous places &middot; Social imaginaries</footer>
</div>
<script>
const BANKS = {"en": [{"id": "q01", "title": "Definition: convergence", "source": "Slides p.3", "prompt": "Which option best defines media convergence?", "options": [{"text": "Separate media becoming similar or connected", "correct": true}, {"text": "Old media disappearing without replacement", "correct": false}, {"text": "Digital devices removing social meanings", "correct": false}, {"text": "Broadcast media returning to print logic", "correct": false}], "explanation": "Convergence means two or more things, ideas, or technologies becoming similar or coming together. The slide uses camera phones and selfies as an example."}, {"id": "q02", "title": "Definition: cyberactivism", "source": "Widick pp.62, 77-79", "prompt": "Which one-line definition best fits cyberactivism?", "options": [{"text": "Digital media used to organize social movements", "correct": true}, {"text": "Digital media used to sell commercial products", "correct": false}, {"text": "Digital media used to replace public protest", "correct": false}, {"text": "Digital media used to erase local identities", "correct": false}], "explanation": "Cyberactivism means activism organized, amplified, or coordinated through digital and social media. In Widick, it names the social-media conditions that allow movements to connect."}, {"id": "q03", "title": "1980s convergence", "source": "Slides p.6", "prompt": "From the 1980s onward, what was the word convergence most commonly applied to?", "options": [{"text": "Digital integration of text, numbers, image, sound", "correct": true}, {"text": "Printed newspapers replacing television broadcasting", "correct": false}, {"text": "Radio networks separating from computer systems", "correct": false}, {"text": "Public museums rejecting technological progress", "correct": false}], "explanation": "The slide quotes Briggs and Burke: convergence was applied to digital technology integrating text, numbers, images, and sound that had previously been treated separately."}, {"id": "q04", "title": "Microprocessors", "source": "Slides p.6", "prompt": "What did microprocessors make possible in media convergence?", "options": [{"text": "Digitalization of text, audio, and visual media", "correct": true}, {"text": "A return from digital networks to analog-only media", "correct": false}, {"text": "The end of telecommunications infrastructure", "correct": false}, {"text": "A strict split between computing and broadcasting", "correct": false}], "explanation": "Microprocessors enabled many kinds of media content, including text, audio, and visual content, to be digitalized."}, {"id": "q05", "title": "Causes and effects", "source": "Slides p.6", "prompt": "According to the slide, media convergence is best understood as what kind of process?", "options": [{"text": "Economic, cultural, social, institutional, political", "correct": true}, {"text": "Purely technical, private, neutral, automatic, isolated", "correct": false}, {"text": "Mostly literary, poetic, classical, symbolic, printed", "correct": false}, {"text": "Only commercial, domestic, linear, harmless, local", "correct": false}], "explanation": "The slide stresses that media convergence has economic, cultural, social, institutional, and political causes and consequences. It is not just gadget history."}, {"id": "q06", "title": "New media studies", "source": "Slides p.6", "prompt": "What does the phrase “the new media world was a new world of media studies” imply?", "options": [{"text": "New media changed both media and its study", "correct": true}, {"text": "New media ended the need for media studies", "correct": false}, {"text": "New media only repeated old print scholarship", "correct": false}, {"text": "New media belonged outside social analysis", "correct": false}], "explanation": "New media did not simply add devices. It also changed the questions, methods, and objects of media studies."}, {"id": "q07", "title": "Arthur C. Clarke", "source": "Slides p.7", "prompt": "What is Arthur C. Clarke associated with in the slide on satellites?", "options": [{"text": "Predicting or imagining satellites in 1945", "correct": true}, {"text": "Launching Sputnik for the USSR in 1957", "correct": false}, {"text": "Founding NASA as a state agency in 1958", "correct": false}, {"text": "Building the first fibre-optic cable in 1976", "correct": false}], "explanation": "The slide notes that Arthur C. Clarke predicted or imagined satellites in 1945. It also mentions 2001: A Space Odyssey in 1968."}, {"id": "q08", "title": "Sputnik 1", "source": "Slides p.7", "prompt": "Which statement correctly describes Sputnik 1?", "options": [{"text": "USSR satellite, launched in 1957, radio signal", "correct": true}, {"text": "NASA satellite, launched in 1962, television link", "correct": false}, {"text": "British cable, launched in 1976, fibre signal", "correct": false}, {"text": "MIT network, launched in 1968, packet route", "correct": false}], "explanation": "Sputnik 1 was launched by the USSR in 1957. It orbited every 96 minutes and transmitted radio signals to Earth for three weeks."}, {"id": "q09", "title": "NASA response", "source": "Slides p.7", "prompt": "How did the United States respond after Sputnik 1?", "options": [{"text": "It established NASA in 1958", "correct": true}, {"text": "It created Telstar in 1945", "correct": false}, {"text": "It launched Intelsat in 1957", "correct": false}, {"text": "It built ARPANET in 1975", "correct": false}], "explanation": "The slide presents NASA, the National Aeronautics and Space Agency, as the U.S. response after Sputnik."}, {"id": "q10", "title": "Telstar", "source": "Slides p.7", "prompt": "Why is Telstar significant for media convergence?", "options": [{"text": "It enabled first satellite television transmissions", "correct": true}, {"text": "It made the first personal computer affordable", "correct": false}, {"text": "It created the first global email community", "correct": false}, {"text": "It carried the first transatlantic fibre cable", "correct": false}], "explanation": "Telstar, associated with NASA in 1962, enabled the first satellite TV transmissions."}, {"id": "q11", "title": "Syncom III", "source": "Slides p.7", "prompt": "What did Syncom III transmit according to the slide?", "options": [{"text": "The 1964 Tokyo Olympics broadcast", "correct": true}, {"text": "The first ARPANET packet message", "correct": false}, {"text": "The first Web browser demonstration", "correct": false}, {"text": "The 1999 Seattle WTO protest", "correct": false}], "explanation": "Syncom III transmitted the 1964 Tokyo Olympics, making satellite broadcasting part of global media experience."}, {"id": "q12", "title": "Intelsat I", "source": "Slides p.7", "prompt": "What was Intelsat I “Early Bird” in 1965?", "options": [{"text": "First geostationary communications satellite", "correct": true}, {"text": "First commercial fibre-optic cable system", "correct": false}, {"text": "First packet data network for universities", "correct": false}, {"text": "First open-publishing activist newsroom", "correct": false}], "explanation": "Intelsat I, called Early Bird, was the first geostationary communications satellite."}, {"id": "q13", "title": "Geostationary orbit", "source": "Slides p.7", "prompt": "What makes a geostationary communications satellite useful?", "options": [{"text": "It stays over one location above the equator", "correct": true}, {"text": "It moves randomly to avoid national regulation", "correct": false}, {"text": "It travels underground through fibre networks", "correct": false}, {"text": "It switches television into printed newspapers", "correct": false}], "explanation": "A geostationary satellite travels with Earth’s rotation, so it appears to remain over a single geographic location above the equator."}, {"id": "q14", "title": "Terrestrial footprint", "source": "Slides p.7", "prompt": "What does the satellite “terrestrial footprint” issue refer to?", "options": [{"text": "Finite orbital slots bargained through radio conferences", "correct": true}, {"text": "Unlimited satellites floating outside political disputes", "correct": false}, {"text": "Private phones replacing all public broadcasting systems", "correct": false}, {"text": "Printed maps proving that satellites were unnecessary", "correct": false}], "explanation": "The slide says terrestrial footprint involves finite slots, bargained at World Administrative Radio Conferences. Infrastructure is also political space."}, {"id": "q15", "title": "Fibre-optic convergence", "source": "Slides p.7", "prompt": "Which sequence best captures the fibre-optic cable point?", "options": [{"text": "Cable networks converged with satellites through fibre", "correct": true}, {"text": "Cable networks ended satellites through radio alone", "correct": false}, {"text": "Cable networks avoided all telecommunications links", "correct": false}, {"text": "Cable networks returned broadcasting to paper forms", "correct": false}], "explanation": "The slide says cable networks converged with satellite systems through fibre-optic cables, including a first commercial UK cable in 1976 and a transatlantic cable in 1988."}, {"id": "q16", "title": "Internet overlooked", "source": "Slides p.8", "prompt": "What is striking about the 1991 MIT book Technology 2001 in the slide?", "options": [{"text": "It omitted Internet, World Wide Web, and cyberspace", "correct": true}, {"text": "It predicted social media would govern COP17 protests", "correct": false}, {"text": "It argued ARPANET had already replaced email use", "correct": false}, {"text": "It centered Indymedia as the future of journalism", "correct": false}], "explanation": "Even in 1991, a major computing book made no reference to the Internet, the World Wide Web, or cyberspace, showing how uncertain media futures were."}, {"id": "q17", "title": "Internet from below", "source": "Slides p.8", "prompt": "Why did Eli Noam see the Internet as a major twentieth-century contribution?", "options": [{"text": "It was loose, ownerless, and grew from below", "correct": true}, {"text": "It was centralized, state-owned, and grew from above", "correct": false}, {"text": "It was printed, national, and controlled by editors", "correct": false}, {"text": "It was private, closed, and hostile to participation", "correct": false}], "explanation": "The slide quotes Noam: the Internet was loose, under no single ownership, and seemed to grow from below rather than from above."}, {"id": "q18", "title": "ARPANET purpose", "source": "Slides p.8", "prompt": "What was ARPANET originally set up to do?", "options": [{"text": "Share information among universities and research institutions", "correct": true}, {"text": "Broadcast television signals to Olympic audiences worldwide", "correct": false}, {"text": "Filter Indymedia posts for ideological moderation only", "correct": false}, {"text": "Sell commercial software to corporate advertisers online", "correct": false}], "explanation": "ARPANET was set up in 1968/69 by the U.S. Department of Defense to share information among high-tech universities and research institutions."}, {"id": "q19", "title": "Packet data", "source": "Slides p.8", "prompt": "How did ARPANET’s packet data system work?", "options": [{"text": "It broke information into pieces routed through nodes", "correct": true}, {"text": "It sent one fixed broadcast through a single tower", "correct": false}, {"text": "It printed messages and mailed them by post", "correct": false}, {"text": "It stored all messages inside one destroyed computer", "correct": false}], "explanation": "The sending system broke information into encoded pieces, and the receiving system reassembled them after they traveled by the quickest route through computer nodes."}, {"id": "q20", "title": "ARPANET perspectives", "source": "Slides p.8", "prompt": "Which pair best matches the Pentagon and academic views of ARPANET?", "options": [{"text": "Survival of network; free access to research", "correct": true}, {"text": "Profitable advertising; celebrity-driven newsrooms", "correct": false}, {"text": "National television; anti-digital publishing rules", "correct": false}, {"text": "Satellite footprints; editorial gatekeeping debates", "correct": false}], "explanation": "From above, ARPANET had to survive destruction of any individual computer. From below, academics valued free access to research."}, {"id": "q21", "title": "Global public sphere", "source": "Slides p.9", "prompt": "Which issue complicates the idea that satellites and the Internet created a global public sphere?", "options": [{"text": "Media literacy gaps and national identities persisted", "correct": true}, {"text": "All states participated equally in global economy", "correct": false}, {"text": "Print and broadcasting imaginaries fully disappeared", "correct": false}, {"text": "Glocalism prevented every form of local expression", "correct": false}], "explanation": "The slide asks whether satellites and the Internet crystallized a global public sphere, but lists issues such as access gaps, national/regional identities, print/broadcasting protocols, and glocalism."}, {"id": "q22", "title": "IMC birth", "source": "Kidd p.413", "prompt": "When and where was the Independent Media Center network born?", "options": [{"text": "Seattle WTO demonstrations in late 1999", "correct": true}, {"text": "Durban COP17 negotiations in late 2011", "correct": false}, {"text": "Tokyo Olympics satellite tests in 1964", "correct": false}, {"text": "MIT computing conference debates in 1991", "correct": false}], "explanation": "Kidd says the IMC was birthed during the Seattle demonstrations against the World Trade Organization in late 1999."}, {"id": "q23", "title": "People’s newsroom", "source": "Kidd p.413", "prompt": "What did Jeff Perlstein call the original IMC storefront?", "options": [{"text": "A community-based people’s newsroom", "correct": true}, {"text": "A corporation-based advertising newsroom", "correct": false}, {"text": "A government-based official newsroom", "correct": false}, {"text": "A university-based research newsroom", "correct": false}], "explanation": "The original IMC storefront was described as a community-based people’s newsroom producing web text, photos, radio, newspaper, and video."}, {"id": "q24", "title": "IMC impact", "source": "Kidd p.413", "prompt": "Which result shows that the IMC outperformed corporate media?", "options": [{"text": "It drew 1.5 million visitors and broke stories", "correct": true}, {"text": "It sold advertisements to national broadcast firms", "correct": false}, {"text": "It became an official WTO press department", "correct": false}, {"text": "It replaced every newspaper in the United States", "correct": false}], "explanation": "Kidd says IMC drew 1.5 million visitors and broke stories largely unreported by corporate U.S. media."}, {"id": "q25", "title": "IMC scale", "source": "Kidd p.413", "prompt": "How large did the IMC network become according to Kidd?", "options": [{"text": "About 5,000 people in 150 groups across 50 countries", "correct": true}, {"text": "About 500 people in 15 groups across 5 countries", "correct": false}, {"text": "About 50 people in 5 groups across 3 countries", "correct": false}, {"text": "About 1,500 people in 500 groups across 1 country", "correct": false}], "explanation": "Kidd describes a worldwide network involving roughly 5,000 people, 150 groups, and 50 countries."}, {"id": "q26", "title": "Web 2.0 before Web 2.0", "source": "Kidd p.414", "prompt": "What Web 2.0-like feature did IMC pioneer?", "options": [{"text": "Anyone with Internet access could upload content", "correct": true}, {"text": "Only experts could approve all online content", "correct": false}, {"text": "Only corporations could publish multimedia content", "correct": false}, {"text": "Anyone without Internet access could block content", "correct": false}], "explanation": "Kidd says the IMC pioneered technologies and software now associated with Web 2.0, especially user-generated multimedia upload."}, {"id": "q27", "title": "Not technological wizardry", "source": "Kidd p.414", "prompt": "According to Kidd, what was the real source of Indymedia’s success?", "options": [{"text": "Volunteer crews, collective intelligence, justice values", "correct": true}, {"text": "Celebrity anchors, corporate funding, product placement", "correct": false}, {"text": "State ownership, official sources, national branding", "correct": false}, {"text": "Technical secrecy, expert control, closed software", "correct": false}], "explanation": "Kidd argues the success was not mere technological wizardry. It came from volunteers combining collective intelligence, experience, organization, and social justice values."}, {"id": "q28", "title": "Participatory democracy", "source": "Kidd p.414", "prompt": "Which structure reflects Indymedia’s participatory democracy?", "options": [{"text": "Horizontal links, autonomous sites, consensus decisions", "correct": true}, {"text": "Vertical commands, centralized sites, executive decisions", "correct": false}, {"text": "Closed links, corporate sites, advertising decisions", "correct": false}, {"text": "National links, state sites, diplomatic decisions", "correct": false}], "explanation": "Kidd calls participatory democracy Indymedia’s philosophical DNA: horizontal links, autonomous local sites, consensus decision-making, and open publishing."}, {"id": "q29", "title": "Mission statement", "source": "Kidd p.414", "prompt": "What did the IMC mission statement emphasize?", "options": [{"text": "Media for social justice and self-determination", "correct": true}, {"text": "Media for corporate profit and market control", "correct": false}, {"text": "Media for state messaging and official unity", "correct": false}, {"text": "Media for celebrity culture and expert authority", "correct": false}], "explanation": "The mission statement says IMC uses media production and distribution to promote social and economic justice and self-determination for underrepresented people."}, {"id": "q30", "title": "Become the media", "source": "Kidd p.415", "prompt": "What does “Don’t hate the media, become the media” mean in Kidd’s chapter?", "options": [{"text": "Create participatory alternatives to dominant media", "correct": true}, {"text": "Join corporate newsrooms to protect media profits", "correct": false}, {"text": "Avoid media production and stay outside politics", "correct": false}, {"text": "Trust official broadcasters to represent all people", "correct": false}], "explanation": "The slogan expresses IMC’s do-it-yourself approach: not just criticizing dominant media, but producing alternative, participatory media."}, {"id": "q31", "title": "IMC reporting style", "source": "Kidd p.415", "prompt": "How did IMC reporting differ from corporate and public broadcasting models?", "options": [{"text": "Direct witness, radical opinion, few expert stars", "correct": true}, {"text": "Paid anchors, narrow frames, many expert celebrities", "correct": false}, {"text": "Official statements, state scripts, no local witnesses", "correct": false}, {"text": "Private advertising, product frames, silent audiences", "correct": false}], "explanation": "Kidd says IMC volunteers combined accuracy with radical opinion and passionate truth-telling, with few stars or talking experts."}, {"id": "q32", "title": "Open publishing", "source": "Kidd p.415", "prompt": "What did Indymedia’s open publishing provide?", "options": [{"text": "A 24/7 forum for self-representation", "correct": true}, {"text": "A paid forum for corporate sponsorship", "correct": false}, {"text": "A private forum for official state messages", "correct": false}, {"text": "A closed forum for expert-only reporting", "correct": false}], "explanation": "Open publishing allowed visitors to represent themselves directly through audio, video, or print reports, and to comment, translate, and post events."}, {"id": "q33", "title": "Indymedia’s roots", "source": "Kidd pp.415-416", "prompt": "What larger convergence did IMC represent?", "options": [{"text": "Social justice, radical media, open source software", "correct": true}, {"text": "State security, commercial media, closed source software", "correct": false}, {"text": "Broadcast nostalgia, print empires, expert gatekeeping", "correct": false}, {"text": "Market branding, celebrity culture, national newspapers", "correct": false}], "explanation": "Kidd says IMC represented a convergence of global social justice movements, radical media makers, and free/open source software."}, {"id": "q34", "title": "Zapatista connection", "source": "Kidd p.416", "prompt": "Why were the Zapatistas important for early Indymedia culture?", "options": [{"text": "They inspired transnational anti-globalization activism", "correct": true}, {"text": "They founded NASA’s satellite television program", "correct": false}, {"text": "They created the first commercial fibre cable", "correct": false}, {"text": "They opposed every form of digital communication", "correct": false}], "explanation": "Kidd connects earlier networks and the Zapatistas’ resistance to NAFTA with the electronic fabric of struggle that shaped anti-globalization activism."}, {"id": "q35", "title": "Growing pains", "source": "Kidd p.417, p.419", "prompt": "Which issue was part of Indymedia’s growing pains?", "options": [{"text": "Sustainability, unequal resources, and participation barriers", "correct": true}, {"text": "Too much state funding and too much official control", "correct": false}, {"text": "A total absence of volunteers and social movements", "correct": false}, {"text": "A complete lack of local sites and global links", "correct": false}], "explanation": "Kidd notes problems of sustainability, unequal distribution of resources, hostile attacks, and barriers to full participation."}, {"id": "q36", "title": "Media and movements", "source": "Widick pp.62-63", "prompt": "What continuity does Widick see across modern social movements?", "options": [{"text": "Changing mass media shape movements in each era", "correct": true}, {"text": "Movements succeed only when media are absent", "correct": false}, {"text": "Media matter only after a movement has ended", "correct": false}, {"text": "Movements always reject images and narratives", "correct": false}], "explanation": "Widick argues that changing mass media have shaped every modern social movement, each in its own time and place."}, {"id": "q37", "title": "Shared experience", "source": "Widick p.63", "prompt": "According to Widick, how do social movements really get moving?", "options": [{"text": "People identify through shared mediated experience", "correct": true}, {"text": "People avoid images and reject narrative memory", "correct": false}, {"text": "People separate local grievances from wider publics", "correct": false}, {"text": "People wait for corporations to define injustice", "correct": false}], "explanation": "Movements gain energy when individuals identify with each other through shared experience, often carried by visual or narrative media across time and space."}, {"id": "q38", "title": "Imagination", "source": "Widick pp.64-65", "prompt": "Why does Widick call imagination crucial for social movements?", "options": [{"text": "People first project themselves into absent collectivities", "correct": true}, {"text": "People first abandon all collective political identities", "correct": false}, {"text": "People first destroy every media channel around them", "correct": false}, {"text": "People first wait for states to assign belonging", "correct": false}], "explanation": "Before joining a rally, organizing, or donating, a person must imagine themselves as part of a group or distant collectivity learned through media."}, {"id": "q39", "title": "Participation online", "source": "Widick p.64-65", "prompt": "What possibility does social media open for people who cannot physically join a march?", "options": [{"text": "They can channel attention into digital publics", "correct": true}, {"text": "They can remove politics from public discussion", "correct": false}, {"text": "They can make movements independent of imagination", "correct": false}, {"text": "They can erase the need for collective identity", "correct": false}], "explanation": "Widick says not everyone can put their bodies into the street, but they can log on and channel attention into the digital semiotic groundswell."}, {"id": "q40", "title": "Dangerous places", "source": "Widick pp.65-66", "prompt": "What makes a place “dangerous” in Widick’s argument?", "options": [{"text": "Local archives of conflict expose structural violence", "correct": true}, {"text": "Local cultures remain untouched by global capitalism", "correct": false}, {"text": "Local histories disappear before publics can form", "correct": false}, {"text": "Local media prevent people from identifying elsewhere", "correct": false}], "explanation": "Dangerous places remember violence through news, archives, monuments, stories, and conflicts. These archives can become political weapons against powerful institutions."}, {"id": "q41", "title": "Violence and institutions", "source": "Widick pp.66-67", "prompt": "How does Widick describe the relation between subjective and objective violence?", "options": [{"text": "Victors’ violence becomes institutional structure", "correct": true}, {"text": "Institutions always remove violence from history", "correct": false}, {"text": "Subjective violence never leaves cultural traces", "correct": false}, {"text": "Objective violence belongs only to natural disasters", "correct": false}], "explanation": "Widick argues that subjective violence by historical victors can become objectified as structural violence within markets, publics, polities, and built environments."}, {"id": "q42", "title": "COP17 and online movement", "source": "Widick pp.77-79", "prompt": "What did Widick’s COP17 experience show about social media and activism?", "options": [{"text": "Being online had become essential to movement coordination", "correct": true}, {"text": "Being offline gave activists better access to protest calls", "correct": false}, {"text": "Email, blogs, and web organizing no longer mattered", "correct": false}, {"text": "Social movements had stopped using digital channels", "correct": false}], "explanation": "At COP17, Widick missed the call to action because he was off the network. He concludes that email, blogs, and web-based organizing are essential conditions for converging movements."}], "ja": [{"id": "q01", "title": "定義：convergence", "source": "スライド p.3", "prompt": "media convergence の定義として最も正しいものはどれか？", "options": [{"text": "別々のメディアが似たり結びついたりすること", "correct": true}, {"text": "古いメディアが何の代替もなく消滅すること", "correct": false}, {"text": "デジタル機器が社会的意味を消し去ること", "correct": false}, {"text": "放送メディアが印刷中心の論理へ戻ること", "correct": false}], "explanation": "convergence は、2つ以上の物・考え・技術が似てくる、または一緒になること。スライドではカメラ付き携帯やセルフィーが例になっている。"}, {"id": "q02", "title": "定義：cyberactivism", "source": "Widick pp.62, 77-79", "prompt": "cyberactivism の一言定義として最も正しいものはどれか？", "options": [{"text": "デジタルメディアで社会運動を組織すること", "correct": true}, {"text": "デジタルメディアで商品販売を宣伝すること", "correct": false}, {"text": "デジタルメディアで街頭抗議を不要にすること", "correct": false}, {"text": "デジタルメディアで地域的な差異を消すこと", "correct": false}], "explanation": "cyberactivism は、デジタル／ソーシャルメディアを使って社会運動を組織し、広げ、つなげる活動。Widickでは、運動を可能にする条件の名前として扱われる。"}, {"id": "q03", "title": "1980年代以降の収斂", "source": "スライド p.6", "prompt": "1980年代以降、convergence という語は主に何に使われたか？", "options": [{"text": "文字・数・画像・音声のデジタル統合", "correct": true}, {"text": "新聞印刷がテレビ放送を置き換える動き", "correct": false}, {"text": "ラジオ網がコンピュータから離れる動き", "correct": false}, {"text": "博物館が技術進歩を拒否する動き", "correct": false}], "explanation": "Briggs & Burkeの引用では、convergence は文字・数・画像・音声など、以前は別々に考えられていた要素のデジタル統合を指す。"}, {"id": "q04", "title": "マイクロプロセッサ", "source": "スライド p.6", "prompt": "マイクロプロセッサはメディア収斂に何を可能にしたか？", "options": [{"text": "文字・音声・映像メディアのデジタル化", "correct": true}, {"text": "デジタル網からアナログ専用媒体への回帰", "correct": false}, {"text": "通信インフラそのものの完全な終焉", "correct": false}, {"text": "計算機と放送の厳密な分離固定", "correct": false}], "explanation": "マイクロプロセッサによって、文字・音声・視覚メディアの内容がデジタル化され、同じ基盤で扱えるようになった。"}, {"id": "q05", "title": "原因と結果", "source": "スライド p.6", "prompt": "スライドでは、media convergence はどのような過程として捉えられているか？", "options": [{"text": "経済・文化・社会・制度・政治に関わる過程", "correct": true}, {"text": "純技術的・私的・中立的・自動的な過程", "correct": false}, {"text": "文学的・詩的・古典的・印刷的な過程", "correct": false}, {"text": "商業的・家庭的・線形的・局地的な過程", "correct": false}], "explanation": "メディア収斂には、経済・文化・社会・制度・政治の原因と結果がある。単なる機械やガジェットの話ではない。"}, {"id": "q06", "title": "新しいメディア研究", "source": "スライド p.6", "prompt": "“the new media world was a new world of media studies” は何を示すか？", "options": [{"text": "新メディアは媒体と研究の両方を変えた", "correct": true}, {"text": "新メディアはメディア研究を完全に不要にした", "correct": false}, {"text": "新メディアは印刷研究だけを反復した", "correct": false}, {"text": "新メディアは社会分析の外側にあった", "correct": false}], "explanation": "新メディアは単に新しい機器を増やしただけではなく、メディア研究そのものの対象・問い・方法も変えた。"}, {"id": "q07", "title": "アーサー・C・クラーク", "source": "スライド p.7", "prompt": "衛星のスライドで、アーサー・C・クラークは何と関係づけられているか？", "options": [{"text": "1945年に衛星を予測・想像したこと", "correct": true}, {"text": "1957年にソ連のスプートニクを打ち上げたこと", "correct": false}, {"text": "1958年にNASAを国家機関として設立したこと", "correct": false}, {"text": "1976年に最初の光ファイバーを建設したこと", "correct": false}], "explanation": "スライドでは、クラークが1945年に衛星を予測・想像した人物として挙げられている。1968年の『2001年宇宙の旅』にも関連づけられる。"}, {"id": "q08", "title": "スプートニク1号", "source": "スライド p.7", "prompt": "スプートニク1号について正しい説明はどれか？", "options": [{"text": "1957年にソ連が打ち上げた無線信号衛星", "correct": true}, {"text": "1962年にNASAが打ち上げたテレビ衛星", "correct": false}, {"text": "1976年に英国が敷設した光ケーブル", "correct": false}, {"text": "1968年にMITが作ったパケット網", "correct": false}], "explanation": "スプートニク1号は1957年にソ連が打ち上げた最初の人工衛星。96分で地球を周回し、3週間にわたり地球へ無線信号を送った。"}, {"id": "q09", "title": "NASAの設立", "source": "スライド p.7", "prompt": "スプートニク1号後、アメリカはどのように対応したか？", "options": [{"text": "1958年にNASAを設立した", "correct": true}, {"text": "1945年にテルスターを作った", "correct": false}, {"text": "1957年にインテルサットを打ち上げた", "correct": false}, {"text": "1975年にARPANETを建設した", "correct": false}], "explanation": "スライドでは、ソ連のスプートニクに対するアメリカの対応として、1958年のNASA設立が示されている。"}, {"id": "q10", "title": "テルスター", "source": "スライド p.7", "prompt": "テルスターがメディア収斂史で重要な理由は何か？", "options": [{"text": "初の衛星テレビ送信を可能にした", "correct": true}, {"text": "初の個人用コンピュータを安価にした", "correct": false}, {"text": "初のグローバルな電子メール共同体を作った", "correct": false}, {"text": "初の大西洋横断光ケーブルを運んだ", "correct": false}], "explanation": "テルスターは1962年、初の衛星テレビ送信を可能にした。放送と衛星通信の結びつきが重要。"}, {"id": "q11", "title": "シンコムIII", "source": "スライド p.7", "prompt": "シンコムIIIは何を送信したと説明されているか？", "options": [{"text": "1964年東京オリンピックの放送", "correct": true}, {"text": "最初のARPANETパケット通信", "correct": false}, {"text": "最初のWebブラウザの実演", "correct": false}, {"text": "1999年シアトルWTO抗議", "correct": false}], "explanation": "シンコムIIIは1964年東京オリンピックを送信した。衛星放送がグローバルなメディア経験へ結びつく例。"}, {"id": "q12", "title": "インテルサットI", "source": "スライド p.7", "prompt": "1965年のインテルサットI “Early Bird” は何だったか？", "options": [{"text": "初の静止通信衛星", "correct": true}, {"text": "初の商業用光ファイバーケーブル", "correct": false}, {"text": "大学向けの初のパケットデータ網", "correct": false}, {"text": "初のオープン出版型活動家ニュース室", "correct": false}], "explanation": "インテルサットI、通称Early Birdは、初の静止通信衛星として説明されている。"}, {"id": "q13", "title": "静止軌道", "source": "スライド p.7", "prompt": "静止通信衛星が有用なのはなぜか？", "options": [{"text": "赤道上の一地点の上に留まるように見えるから", "correct": true}, {"text": "国家規制を避けて無作為に移動するから", "correct": false}, {"text": "地下の光ファイバー網を通って移動するから", "correct": false}, {"text": "テレビ放送を印刷新聞へ変換するから", "correct": false}], "explanation": "静止衛星は地球の自転と同じ方向・速度で動くため、赤道上の特定地点の上に留まっているように見える。"}, {"id": "q14", "title": "地上フットプリント", "source": "スライド p.7", "prompt": "衛星の terrestrial footprint の問題は何を指すか？", "options": [{"text": "有限の軌道枠を国際会議で交渉すること", "correct": true}, {"text": "政治的対立の外で衛星を無限に置けること", "correct": false}, {"text": "私用電話が公共放送を完全に置き換えること", "correct": false}, {"text": "印刷地図が衛星の不要性を証明すること", "correct": false}], "explanation": "terrestrial footprint は有限のスロット問題であり、世界無線主管庁会議などで交渉される。インフラも政治的空間である。"}, {"id": "q15", "title": "光ファイバー収斂", "source": "スライド p.7", "prompt": "光ファイバーケーブルに関する説明として最も正しいものはどれか？", "options": [{"text": "ケーブル網は光ファイバーで衛星と収斂した", "correct": true}, {"text": "ケーブル網は無線だけで衛星を終わらせた", "correct": false}, {"text": "ケーブル網は通信接続をすべて避けた", "correct": false}, {"text": "ケーブル網は放送を紙媒体へ戻した", "correct": false}], "explanation": "スライドでは、ケーブル網が光ファイバーによって衛星と収斂したとされる。1976年に英国で初の商業用光ファイバー、1988年に大西洋横断ケーブル。"}, {"id": "q16", "title": "見落とされたインターネット", "source": "スライド p.8", "prompt": "1991年のMIT本 Technology 2001 について、スライドで注目される点は何か？", "options": [{"text": "Internet・Web・cyberspaceに触れていないこと", "correct": true}, {"text": "COP17抗議をSNSが統治すると予測したこと", "correct": false}, {"text": "ARPANETが電子メールを終わらせたと論じたこと", "correct": false}, {"text": "Indymediaを未来の報道中心に置いたこと", "correct": false}], "explanation": "1991年でも、主要なコンピュータ本がInternet、World Wide Web、cyberspaceに触れていなかった。未来のメディア像がまだ不確実だったことを示す。"}, {"id": "q17", "title": "下から育つインターネット", "source": "スライド p.8", "prompt": "Eli Noam がインターネットを20世紀の大きな貢献と見た理由は何か？", "options": [{"text": "所有者がなく緩く下から成長したから", "correct": true}, {"text": "国家所有で中央集権的に上から成長したから", "correct": false}, {"text": "印刷的で国家的で編集者に統制されたから", "correct": false}, {"text": "私的で閉鎖的で参加に敵対したから", "correct": false}], "explanation": "Noamはインターネットを、所有者が一つでなく、上からではなく下から成長した通信複合体として評価した。"}, {"id": "q18", "title": "ARPANETの目的", "source": "スライド p.8", "prompt": "ARPANETはもともと何のために設置されたか？", "options": [{"text": "大学や研究機関の間で情報を共有するため", "correct": true}, {"text": "五輪中継のテレビ信号を世界へ放送するため", "correct": false}, {"text": "Indymedia投稿を思想的に検閲するため", "correct": false}, {"text": "企業広告用ソフトをオンライン販売するため", "correct": false}], "explanation": "ARPANETは1968/69年に米国国防総省によって設置され、ハイテク大学や研究機関の情報共有を目的とした。"}, {"id": "q19", "title": "パケットデータ", "source": "スライド p.8", "prompt": "ARPANETのパケットデータ方式はどのように働いたか？", "options": [{"text": "情報を小片に分けノード経由で送った", "correct": true}, {"text": "固定された一つの放送を単一塔から送った", "correct": false}, {"text":     const label = attempt.expired ? 'time up' : 'submitted';
    const wrongCount = Array.isArray(attempt.wrong) ? attempt.wrong.length : Math.max(0, (attempt.total || 0) - (attempt.score || 0));
    return `<li><span><strong>Attempt ${history.length - i}</strong><br><span class="attempt-meta">${escapeHtml(formatAttemptDate(attempt.when))} · ${label} · review marks: ${wrongCount}</span></span><span class="attempt-score">${attempt.score} / ${attempt.total} · ${pct}%</span></li>`;
  }).join('');
  return `<section class="attempt-history"><h3>${escapeHtml(m.label)}: ${escapeHtml(m.history)}</h3><ol class="attempt-list">${rows}</ol></section>`;
}
function showGuardToast(message = 'Quiz attempt protected. Finish or submit this attempt first.') {
  let toast = document.getElementById('guardToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'guardToast';
    toast.className = 'guard-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.add('show');
  if (guardToastTimer) clearTimeout(guardToastTimer);
  guardToastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}
function completedCount() {
  return getHistory('ja').length + getHistory('en').length;
}
function renderOpening(message = '') {
  stopTimer();
  activeGuard = false;
  state = null;
  document.documentElement.lang = 'en';
  setQuizChrome(false);
  updateTimerDisplay();
  elCompleted.textContent = String(completedCount());
  elMainTitle.textContent = 'Convergence & Cyberactivism';
  elSubtitle.textContent = '42-question MCQ mastery quiz · Japanese / English · shuffled every attempt';
  const messageBox = message ? `<div class="feedback info practice-message" style="display:block">${escapeHtml(message)}</div>` : `<div class="practice-message"></div>`;
  elCard.innerHTML = `
    <div class="opening">
      <h2>One-session cram mode</h2>
      <p>Same content in Japanese and English. Question order and choice order shuffle every attempt.</p>
      <p><strong>${currentBankSize('en')} multiple-choice questions</strong> per page. Time limit: <strong>${fmt(TOTAL_SECONDS)}</strong> for each session.</p>
      <div class="attempt-badge">Completed attempts: <span id="openingCompleted">${completedCount()}</span></div>
      ${renderAttemptHistoryList('ja', getHistory('ja'))}
      ${renderAttemptHistoryList('en', getHistory('en'))}
      <div class="opening-actions">
        <button class="btn" onclick="makeAttempt('ja')">${escapeHtml(META.ja.start)}</button>
        <button class="btn ghost" onclick="makeAttempt('en')">${escapeHtml(META.en.start)}</button>
      </div>
      ${messageBox}
    </div>`;
}
function makeAttempt(lang) {
  const questions = shuffle(BANKS[lang].map(q => ({ ...q, options: shuffle(q.options) })));
  state = {
    lang,
    idx: 0,
    questions,
    answers: {},
    startedAt: Date.now(),
    remaining: TOTAL_SECONDS,
    active: true,
    submitted: false
  };
  activeGuard = true;
  document.documentElement.lang = lang === 'ja' ? 'ja' : 'en';
  elMainTitle.textContent = META[lang].title;
  elSubtitle.textContent = META[lang].subtitle;
  elScore.textContent = '0';
  elQTotal.textContent = String(questions.length);
  window.history.pushState({quiz:true}, '', location.href);
  setQuizChrome(true);
  render();
  startTimer();
}
function currentQuestion() {
  return state.questions[state.idx];
}
function correctCount() {
  return Object.values(state.answers).filter(answer => answer.correct && !answer.revealed).length;
}
function answeredCount() {
  return Object.keys(state.answers).length;
}
function renderJump() {
  elJump.innerHTML = '';
  state.questions.forEach((q, i) => {
    const answer = state.answers[q.id];
    const button = document.createElement('button');
    button.textContent = i + 1;
    button.className = (i === state.idx ? 'current ' : '') + (answer ? (answer.correct && !answer.revealed ? 'done' : 'miss') : '');
    button.onclick = () => go(i);
    elJump.appendChild(button);
  });
}
function render() {
  if (!state) return renderOpening();
  const m = META[state.lang];
  const q = currentQuestion();
  const answer = state.answers[q.id];
  updateTimerDisplay();
  renderJump();
  elProgress.style.width = (state.idx / state.questions.length * 100) + '%';
  elQIdx.textContent = state.idx + 1;
  elQTotal.textContent = state.questions.length;
  elScore.textContent = String(correctCount());
  const letters = ['A', 'B', 'C', 'D'];
  const options = q.options.map((option, i) => {
    let cls = 'opt';
    if (answer) {
      if (option.correct) cls += answer.revealed ? ' reveal' : ' correct';
      if (answer.selected === i && !option.correct) cls += ' wrong';
    }
    return `<button class="${cls}" ${answer ? 'disabled' : ''} onclick="choose(${i})"><span class="marker">${letters[i]}</span><span class="optText">${escapeHtml(option.text)}</span></button>`;
  }).join('');
  const feedback = answer
    ? `<div class="feedback ${answer.correct && !answer.revealed ? 'good' : (answer.revealed ? 'info' : 'bad')}" id="fb" style="display:block"><strong>${escapeHtml(answer.revealed ? m.revealed : (answer.correct ? m.correct : m.wrong))}</strong> ${escapeHtml(q.explanation)}</div>`
    : '<div class="feedback" id="fb"></div>';
  elCard.innerHTML = `
    <div class="qnum">${escapeHtml(m.question)} ${state.idx + 1} ${escapeHtml(m.of)} ${state.questions.length}<span class="qtype-tag">${escapeHtml(m.mcq)}</span></div>
    <p class="qtext">${escapeHtml(q.prompt)}</p>
    <div class="source">${escapeHtml(m.source)}: ${escapeHtml(q.source)} · ${escapeHtml(q.title)}</div>
    <div class="options">${options}</div>
    <p class="small">Wrong choices are plausible exam traps. Read the wording slowly.</p>
    ${feedback}
    <div class="actions submit-row" id="acts">
      <div>
        <button class="btn ghost arrow" onclick="move(-1)" aria-label="Previous question" title="Previous question" ${state.idx === 0 ? 'disabled' : ''}>${escapeHtml(m.prev)}</button>
        <button class="btn ghost arrow" onclick="move(1)" aria-label="Next question" title="Next question" ${state.idx === state.questions.length - 1 ? 'disabled' : ''}>${escapeHtml(m.next)}</button>
        <button class="btn ghost" onclick="showAnswer()" ${answer ? 'disabled' : ''}>${escapeHtml(m.show)}</button>
      </div>
      <div>
        <span class="submit-note">${answeredCount()}/${state.questions.length}</span>
        <button class="btn" onclick="submitAttempt(false)">${escapeHtml(m.submit)}</button>
      </div>
    </div>`;
}
function choose(i) {
  const q = currentQuestion();
  if (state.answers[q.id]) return;
  const correct = !!q.options[i].correct;
  state.answers[q.id] = { selected: i, correct, revealed: false };
  render();
}
function showAnswer() {
  const q = currentQuestion();
  if (state.answers[q.id]) return;
  const i = q.options.findIndex(option => option.correct);
  state.answers[q.id] = { selected: i, correct: false, revealed: true };
  render();
}
function move(delta) {
  if (!state) return;
  state.idx = Math.max(0, Math.min(state.questions.length - 1, state.idx + delta));
  render();
}
function go(i) {
  state.idx = i;
  render();
}
function showSubmittingScreen() {
  const m = META[state.lang];
  setQuizChrome(false);
  elCard.innerHTML = `<div class="loading-screen"><div class="loading-panel"><div class="wait-orb"><div class="wait-ring ring-a"></div><div class="wait-ring ring-b"></div><div class="wait-core"></div><div class="wait-dot"></div></div><div class="loading-title">${escapeHtml(m.wait)}</div><div class="loading-sub">${escapeHtml(m.waitSub)}</div><div class="loading-mini">This will take about 1 second.</div></div></div>`;
}
function submitAttempt(expired = false) {
  if (!state || state.submitted) return;
  state.submitted = true;
  state.active = false;
  activeGuard = false;
  stopTimer();
  showSubmittingScreen();
  setTimeout(() => showResult(expired), 900);
}
function showResult(expired) {
  const m = META[state.lang];
  const total = state.questions.length;
  const answered = answeredCount();
  let score = 0;
  const wrong = [];
  for (const q of state.questions) {
    const answer = state.answers[q.id];
    if (answer && answer.correct && !answer.revealed) score++;
    else wrong.push(q.id);
  }
  const history = getHistory(state.lang);
  history.unshift({ when: Date.now(), score, total, answered, expired, wrong });
  setHistory(state.lang, history);
  setQuizChrome(false);
  const pct = Math.round(score / total * 100);
  elCompleted.textContent = String(completedCount());
  elCard.innerHTML = `
    <div class="result">
      <h2>${escapeHtml(m.result)}</h2>
      <div class="score-big">${score} / ${total}</div>
      <p>${pct}%</p>
      <p class="small">${escapeHtml(m.answered)}: ${answered} / ${total}. ${wrong.length} wrong / revealed / unanswered.</p>
      <div class="actions" style="justify-content:center">
        <button class="btn" onclick="makeAttempt('${state.lang}')">${escapeHtml(m.restart)}</button>
        <button class="btn ghost" onclick="renderOpening()">${escapeHtml(m.back)}</button>
      </div>
    </div>`;
  state = null;
}

window.addEventListener('beforeunload', e => {
  if (activeGuard && state && state.active) {
    e.preventDefault();
    e.returnValue = '';
  }
});
window.addEventListener('popstate', () => {
  if (activeGuard && state && state.active) {
    window.history.pushState({quiz:true}, '', location.href);
    showGuardToast(META[state.lang].confirmHome);
  }
});

renderOpening();
</script>
</body>
</html>
